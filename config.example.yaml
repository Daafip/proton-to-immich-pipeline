# proton-to-immich-pipeline -- copy to config.yaml and edit.
# Every key here is optional; anything omitted falls back to src/config.py DEFAULTS.
#
# This is the single-account shape. For two people, see
# config.accounts.example.yaml -- that form needs PyYAML installed, because
# the built-in fallback parser cannot read maps inside a list.

# Who these photos belong to. One name, used to scope every row in
# state.sqlite. "default" keeps the v1 filenames for the lock and status.json,
# so an existing install can be upgraded without touching anything else;
# any other name gets sync-<name>.lock and status-<name>.json.
account:
  name: default

staging:
  root: /mnt/immich/staging
  # Abort a download pass if free space would drop below this (GB).
  # Staging shares the SSD with Immich's own data.
  min_free_gb: 20

proton:
  # "proton-cli" = the official Bun binary. "rclone" = the Phase 0 fallback
  # (rclone's protondrive backend; credentials in rclone.conf, no keyring).
  backend: proton-cli
  binary: proton-drive
  # PROTON_DRIVE_CACHE_DIR. Defaults to <staging.root>/.proton.
  cache_dir: /mnt/immich/staging/.proton
  # Where the CLI keeps its session (PROTON_DRIVE_CREDENTIALS_STORE):
  #   keychain    -- libsecret / Secret Service. The default, but it needs an
  #                  unlocked keyring, which is painful on a headless VM.
  #   unsafe_file -- plaintext session file in cache_dir. Works headless with
  #                  no keyring; cache_dir is chmod 700, keep it that way.
  #   pass        -- the Unix `pass` store, GPG-backed and headless-friendly.
  credentials_store: unsafe_file
  # Folders to sync. Every entry is walked recursively, so one parent folder
  # covers everything beneath it. Discover what is there with:
  #   proton-drive filesystem list /              # top-level sections
  #   proton-drive filesystem list /my-files/Photos
  #
  # Quotes are only needed if a name contains a colon; spaces are fine either
  # way. Paths are always posix, and a literal / inside a folder name is
  # escaped with a backslash.
  roots:
    - /my-files/Photos

  # Paths, never patterns: a `*` is not expanded by anything and the CLI
  # reports `Node not found: *`. One parent already covers everything under
  # it. List folders individually to sync a subset -- one year per night keeps
  # a backfill within the per-run caps and the staging free-space floor:
  #
  # roots:
  #   - "/my-files/Photos/Photos from 2025"
  #   - "/my-files/Photos/Photos from 2026"

  # Files per `filesystem download` call. The CLI costs ~1.2 s of Bun and SDK
  # startup per invocation whatever it does, so one call per file is ~8 hours
  # of pure startup for a 25k-file backfill; at 25 that becomes ~21 minutes.
  #
  # Batches are grouped by source folder and never contain two files with the
  # same name, because they all land in one destination folder and the
  # conflict strategy would silently keep the wrong one.
  #
  # Set to 1 to go back to one invocation per file -- that is the escape hatch
  # if the first backfill night misbehaves. Nothing is lost either way: a file
  # is size-checked and sha1'd before it leaves the scratch folder.
  download_batch_size: 25
  # Per-invocation budget. Scales with the batch automatically, so this stays
  # the time one file is allowed.
  timeout_sec: 900
  max_depth: 25
  extensions:
    - .jpg
    - .jpeg
    - .png
    - .heic
    - .heif
    - .dng
    - .mp4
    - .mov
  exclude_globs:
    - .*
    - "*/.trash/*"
  # There is no `auth status` subcommand; listing this path is the session probe.
  auth_probe_path: "/"
  # The CLI defaults to DEBUG and writes proton-drive.log into cache_dir with
  # no rotation. DEBUG | INFO | WARNING | ERROR.
  cli_log_level: WARNING
  # Argument templates, verified against cli-drive@0.6.0 and 0.8.0.
  # {path} = remote path, {dest_dir} = local destination FOLDER (the CLI takes
  # a folder and picks the filename itself).
  # The conflict flag stops the CLI prompting. Long form on purpose: 0.6.0
  # accepts "-c" or "--conflict-strategy", 0.8.0 dropped "-c" and errors on
  # it. If a future build rejects this one too, the backend retries with no
  # flag and logs proton.conflict_flag_fallback -- pin the working form here.
  cmd:
    list:
      - filesystem
      - list
      - "{path}"
      - --json
    download:
      - filesystem
      - download
      - --conflict-strategy
      - skip
      - "{path}"
      - "{dest_dir}"
    # Used only by the delete queue. `info` re-resolves a node before it is
    # touched; `trash` is reversible. `filesystem delete` and `empty-trash`
    # are permanent and are never invoked by this pipeline.
    info:
      - filesystem
      - info
      - "{path}"
      - --json
    trash:
      - filesystem
      - trash
      - "{path}"
  rclone:
    binary: rclone
    remote: "protondrive:"

immich:
  # MUST include the /api suffix.
  # Loopback is fine in both upload modes: "api" uploads from this process,
  # and for "cli" the container is given --network host so 127.0.0.1 still
  # means this machine. Point it elsewhere for an Immich on another host.
  url: http://127.0.0.1:2283/api
  # Leave empty and set IMMICH_API_KEY in the environment instead.
  api_key: ""
  # "cli" = docker run immich-cli (the build plan's route).
  # "api" = direct REST multipart upload, no docker needed.
  upload_mode: cli
  image: ghcr.io/immich-app/immich-cli:latest
  concurrency: 4
  # "flat" -> one album_name for everything. "folder" -> album per source
  # folder. "none" -> no album. Decide before the first real push.
  album_strategy: flat
  album_name: Proton Import
  # docker flags for upload_mode: cli, inserted after `docker run --rm`.
  # Empty is right for almost everyone: a loopback url gets --network host
  # added for you. Set --network explicitly here to override that.
  docker_args: []
  batch_mode: hardlink
  # Ask Immich whether it already holds a file -- matching Proton's reported
  # sha1 against Immich's own dedupe index -- and skip downloading it if so.
  # Worth turning on for a re-run or against an Immich that already has some
  # of the library; it saves nothing against an empty one. Off by default
  # because Proton reports the digest as unverified (sha1Verified: false).
  precheck_claimed_digests: false

limits:
  max_files: 500
  max_bytes: 20000000000
  max_attempts: 5
  backoff_base_sec: 300
  # Global circuit breaker: stop the pass after this many failures in a row,
  # in download, push and verify. Per-asset backoff does not help when Proton
  # or Immich goes down mid-backfill -- every file fails in quick succession,
  # each burns an attempt, and after five such nights they are all
  # quarantined. A single success resets the count, so scattered bad files do
  # not trip it. Rows never reached keep their attempts. 0 disables it.
  consecutive_failures: 25

backfill:
  max_files: 5000
  max_bytes: 60000000000

reap:
  # Keep verified originals in staging this long. 0 = purge right after verify.
  keep_days: 7
  scratch_max_age_hours: 48

# Ask Immich what is in its trash at the end of every run, and stage the
# matching Proton files for deletion. Reconcile never touches Proton -- it
# only ever adds rows to the staged list, which `sync.py staged` prints.
#
# Immich empties its own trash after ~30 days, so the list has to live in
# state.sqlite from first sighting: recomputing it from the server would
# silently drop anything you had not got to, while the file stayed in Proton.
# Extend or disable the auto-empty in Immich under
# Administration -> Settings -> Trash so a staged photo can still be looked up.
reconcile:
  enabled: true
  # /search/metadata takes one type per request.
  types:
    - IMAGE
    - VIDEO
  page_size: 250
  max_pages: 400

delete:
  # What `sync.py delete-staged` (and the UI's execute button) actually does.
  #
  #   mark_only -- nothing is sent to Proton. The queue is a to-do list: you
  #                delete the files in Proton yourself, then close the rows
  #                out. `sync.py staged --csv` gives you the paths.
  #   execute   -- runs `proton-drive filesystem trash`, which is reversible.
  #                Every node is re-resolved and compared with what was staged
  #                first, and verified afterwards.
  #
  # mark_only is the default on purpose. Proton's support docs say items in
  # the Photos section cannot be deleted from desktop apps, and that is
  # unverified from the CLI. A /my-files/... root -- what proton.roots ships
  # with -- is the execute case. Try it with `--dry-run` first, then on a
  # couple of junk files.
  #
  # The rclone backend cannot trash, only delete permanently, so it stays
  # mark_only whatever this says.
  action: mark_only
  # Hard cap per invocation, whatever the UI or the CLI asks for.
  batch_cap: 50

# The web UI: `sync.py serve`. Standard library only, no build step.
web:
  # 127.0.0.1 is the safe default. Point this at the LAN address (or 0.0.0.0)
  # to let someone else use it -- `serve` refuses a non-loopback bind with no
  # password rather than publishing the delete queue.
  bind: 127.0.0.1
  port: 8080
  # How a "Sync now" click actually runs:
  #   subprocess -- a jobs table plus one worker thread in the serve process,
  #                 which spawns `sync.py run`. No sudo, works from a checkout.
  #   systemd    -- `systemctl start proton-to-immich-pipeline@<account>` via
  #                 a narrow NOPASSWD sudoers entry (see systemd/sudoers.example).
  #                 systemd then owns the lock, the logging and the exit code.
  job_runner: subprocess
  systemd_unit: proton-to-immich-pipeline@{account}.service
  # scrypt hash from `sync.py web-password`. Leave empty and set
  # PIS_WEB_PASSWORD_HASH in the environment instead (systemd/env.web).
  # Required for any bind other than loopback.
  password_hash: ""
  session_hours: 168
  # Poll intervals the page uses: fast while a job runs, slow when idle.
  poll_active_sec: 3
  poll_idle_sec: 30

report:
  # Defaults to <staging.root>/.state/status.json.
  status_path: /mnt/immich/staging/.state/status.json
  stale_success_hours: 48

mqtt:
  enabled: false
  host: 127.0.0.1
  port: 1883
  username: ""
  password: ""
  discovery_prefix: homeassistant
  node_id: proton_immich_sync
  state_topic: proton_immich_sync/state

logging:
  json: true
  verbose: false
