# proton-to-immich-pipeline -- two people, one VM, one Immich.
#
# NEEDS PyYAML:  apt install python3-yaml
# The built-in fallback parser cannot read maps inside a list, and it says so
# rather than guessing. Everything else in this project stays dependency-free.
#
# Start from config.example.yaml for the single-account shape and the
# explanation of each key. This file only shows what changes.

# ---------------------------------------------------------------------------
# Shared by every account. Anything an account entry does not override is
# taken from here, so the Immich URL, the CLI templates and the limits stay in
# one place.
# ---------------------------------------------------------------------------

staging:
  # The parent. Each account gets its own subtree below, and the shared
  # state.sqlite lives in <root>/.state regardless.
  root: /mnt/immich/staging
  min_free_gb: 20

proton:
  backend: proton-cli
  # unsafe_file keeps each session in that account's own cache_dir. This is
  # what makes two accounts possible at all: the CLI's keyring path uses one
  # fixed service name (ch.proton.drive/drive-sdk-cli), so two accounts
  # sharing a keyring would invalidate each other's session.
  credentials_store: unsafe_file
  cli_log_level: WARNING

immich:
  url: http://127.0.0.1:2283/api
  upload_mode: cli
  album_strategy: flat
  # NOTE: do NOT set immich.api_key here, and do not put IMMICH_API_KEY in the
  # shared systemd env file. Either would give every account the same key and
  # upload one person's photos into the other's library. `sync.py status`
  # refuses a config where two accounts share a key.

limits:
  max_files: 500
  max_bytes: 20000000000

reap:
  keep_days: 7

reconcile:
  enabled: true

web:
  bind: 127.0.0.1
  port: 8080
  job_runner: subprocess
  # Required before binding anywhere but loopback. `sync.py web-password`
  # prints one.
  password_hash: ""

# ---------------------------------------------------------------------------
# The accounts. Three things must differ per account, and `sync.py status`
# refuses the config if any of them collides:
#
#   staging_dir           -- never a shared ready/; the reaper works per account
#   proton_cache_dir      -- one Proton session per directory
#   immich_api_key_file   -- a separate Immich USER per person
#
# state.sqlite is deliberately shared: rows are scoped by an `account` column,
# which is what lets the UI show both at once and keeps a node id from ever
# being interpreted against the wrong volume.
#
# Each key file is chmod 640 root:protonsync and holds just the key:
#   install -o root -g protonsync -m 640 /dev/null /etc/proton-to-immich-pipeline/david.key
#   printf '%s' 'the-key' | sudo tee /etc/proton-to-immich-pipeline/david.key
# ---------------------------------------------------------------------------

accounts:
  - name: david
    staging_dir: /mnt/immich/staging/david
    proton_cache_dir: /mnt/immich/staging/.proton/david
    immich_api_key_file: /etc/proton-to-immich-pipeline/david.key
    proton_roots:
      - /my-files/Photos
    album_name: "Proton Import (David)"
    # /my-files is where `filesystem trash` is expected to work.
    delete_action: execute

  - name: mirjam
    staging_dir: /mnt/immich/staging/mirjam
    proton_cache_dir: /mnt/immich/staging/.proton/mirjam
    immich_api_key_file: /etc/proton-to-immich-pipeline/mirjam.key
    proton_roots:
      - /my-files/Camera
    album_name: "Proton Import (Mirjam)"
    # Her library may live under the Photos section, where the CLI's delete
    # support is unverified. Leave it as a to-do list until tested.
    delete_action: mark_only

# The long nested form works too, and is what the shorthand above expands to.
# Use it when an account needs something with no shorthand key:
#
#  - name: mirjam
#    staging: {root: /mnt/immich/staging/mirjam}
#    proton:
#      cache_dir: /mnt/immich/staging/.proton/mirjam
#      roots: ["/my-files/Camera"]
#      extensions: [".jpg", ".heic", ".mov"]
#    immich:
#      api_key_file: /etc/proton-to-immich-pipeline/mirjam.key
#      album_name: "Proton Import (Mirjam)"
#    delete: {action: mark_only}
#    limits: {max_files: 200}

# ---------------------------------------------------------------------------
# Running it
#
#   sync.py --account david login        # once per account, per session
#   sync.py --account david run
#   sync.py status                       # no --account: reports on both
#
# Nightly, one templated timer per account, staggered so they never download
# at the same time -- each holds only its own lock:
#
#   systemctl enable --now proton-to-immich-pipeline@david.timer
#   systemctl enable --now proton-to-immich-pipeline@mirjam.timer
#   systemctl edit proton-to-immich-pipeline@mirjam.timer
#     [Timer]
#     OnCalendar=
#     OnCalendar=*-*-* 04:45:00
# ---------------------------------------------------------------------------
