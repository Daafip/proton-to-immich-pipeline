# proton-to-immich-pipeline -- two independent pipelines on one VM.
#
# Each pipeline has its own Proton account, its own staging tree and its own
# database. They share the VM, and normally they share one Immich instance --
# with a SEPARATE USER and therefore a SEPARATE API KEY for each person. The
# key is what decides whose library an upload lands in.
#
# Two separate Immich instances work just as well: give each account its own
# immich_url below. Nothing else changes.
#
# For the container version of exactly this, see docker-compose.yml and
# config.docker.yaml -- one container per pipeline plus one for the UI, which
# is a good deal less to install than the bare-metal path.
#
# NEEDS PyYAML:  apt install python3-yaml
# The built-in fallback parser cannot read maps inside a list, and it says so
# rather than guessing. Everything else in this project stays dependency-free.
#
# Start from config.example.yaml for the single-account shape and the
# explanation of each key. This file only shows what changes.
#
# ALREADY RUNNING WITH ONE ACCOUNT? Do not just paste this over your config.
# Every row in state.sqlite is stamped with the account name it was synced
# under -- "default" unless you changed it -- and renaming the account here
# does NOT rename it there. The puller then finds nothing it recognises and
# re-downloads the entire library, while the old rows sit orphaned.
#
#   docs/operations.md -> "Going from one account to two"
#
# has the runbook, including the five-table rename and the one dry-run that
# proves it worked.

# ---------------------------------------------------------------------------
# Shared by every account. Anything an account entry does not override is
# taken from here, so the Immich URL, the CLI templates and the limits stay in
# one place.
# ---------------------------------------------------------------------------

# `{account}` is replaced with each pipeline's own name when its settings are
# resolved. Writing the per-account paths once, here, is what keeps a fifth
# person to a single line in the accounts list -- and makes it impossible for
# two of them to share a staging directory or a key by copy-paste.
state:
  # Shared: one <account>.sqlite per pipeline, all in this one directory, so
  # the UI finds them with a single read-only mount. NOT templated.
  dir: /mnt/immich/staging/.state

staging:
  root: /mnt/immich/staging/{account}
  min_free_gb: 20

proton:
  backend: proton-cli
  # unsafe_file keeps each session in that account's own cache_dir. This is
  # what makes two accounts possible at all: the CLI's keyring path uses one
  # fixed service name (ch.proton.drive/drive-sdk-cli), so two accounts
  # sharing a keyring would invalidate each other's session.
  credentials_store: unsafe_file
  cli_log_level: WARNING

immich:
  # Shared by both accounts: one Immich instance. Override it per account with
  # immich_url if the two people are on different instances.
  url: http://127.0.0.1:2283/api
  upload_mode: cli
  album_strategy: flat
  # Resolved per account: david.key, mirjam.key, alice.key ...
  # One key per person, issued by that person's own Immich user.
  api_key_file: /etc/proton-to-immich-pipeline/{account}.key
  #
  # NOTE: do NOT set immich.api_key here, and do not put IMMICH_API_KEY in the
  # shared systemd env file. Either would give every account the same key and
  # upload one person's photos into the other's library. `sync.py status`
  # refuses a config where two accounts share a key.

limits:
  max_files: 500
  max_bytes: 20000000000

reap:
  keep_days: 7

reconcile:
  enabled: true

web:
  bind: 127.0.0.1
  port: 8080
  job_runner: subprocess
  # Required before binding anywhere but loopback. `sync.py web-password`
  # prints one.
  password_hash: ""

# ---------------------------------------------------------------------------
# The accounts. Three things must differ per account, and `sync.py status`
# refuses the config if any of them collides:
#
#   staging_dir           -- never a shared ready/; the reaper works per account
#   proton_cache_dir      -- one Proton session per directory. Optional: it
#                            defaults to <staging_dir>/.proton, which is
#                            already per-account.
#   immich_api_key_file   -- a separate Immich USER per person. One instance is
#                            fine; the key is what separates the libraries,
#                            and two accounts sharing one is refused.
#
# Each account also gets **its own database**, <name>.sqlite, in the shared
# state directory. One writer per file, so two pipelines -- two containers,
# two systemd units -- never contend for a write lock and a bug in one cannot
# reach the other's rows. The UI mounts that one directory read-only and
# combines them.
#
# Each key file is chmod 640 root:protonsync and holds just the key:
#   install -o root -g protonsync -m 640 /dev/null /etc/proton-to-immich-pipeline/default.key
#   printf '%s' 'the-key' | sudo tee /etc/proton-to-immich-pipeline/default.key
# ---------------------------------------------------------------------------

# The first account is called "default" because that is what an existing
# single-account install already has stamped on every row in its database, and
# because `default` is special-cased: it keeps sync.lock, status.json and the
# original MQTT node and topic, so Home Assistant entities do not move.
#
# Keeping it is the zero-migration path. Renaming it is a real migration --
# see docs/operations.md, "Going from one account to two". A fresh install can
# use any name.
#
# One line per person. Everything above that mentions `{account}` resolves
# with this name, so nothing here repeats a path:
#
#   database   <state.dir>/<name>.sqlite
#   staging    /mnt/immich/staging/<name>   (and .proton inside it)
#   key file   /etc/proton-to-immich-pipeline/<name>.key
#   lock       sync-<name>.lock             (plain sync.lock for "default")
#   status     status-<name>.json           (plain status.json for "default")
#   MQTT       proton_immich_sync/<name>/state
#
# Add only what genuinely differs for that person.
accounts:
  - name: default
    proton_roots:
      - /my-files/Photos
    album_name: "Proton Import"
    # /my-files is where `filesystem trash` is expected to work.
    delete_action: execute

  - name: mirjam
    proton_roots:
      - /my-files/Camera
    album_name: "Proton Import"
    # Her library may live under the Photos section, where the CLI's delete
    # support is unverified. Leave it as a to-do list until tested.
    delete_action: mark_only

  # A fifth person is a fifth entry:
  #
  # - name: alice
  #   proton_roots: ["/my-files/Photos"]
  #
  # Someone on a different Immich instance adds one line:
  #
  # - name: bob
  #   immich_url: http://127.0.0.1:2284/api

# Each key file is chmod 640 root:protonsync and holds just the key:
#   install -o root -g protonsync -m 640 /dev/null \
#           /etc/proton-to-immich-pipeline/default.key
#   printf '%s' 'the-key' | sudo tee /etc/proton-to-immich-pipeline/default.key

# ---------------------------------------------------------------------------
# Running it
#
#   sync.py --account default login      # once per account, per session
#   sync.py --account default run
#   sync.py status                       # no --account: reports on all of them
#
# Nightly, one templated timer per account, staggered so they never download
# at the same time -- each holds only its own lock:
#
#   systemctl enable --now proton-to-immich-pipeline@default.timer
#   systemctl enable --now proton-to-immich-pipeline@mirjam.timer
#   systemctl edit proton-to-immich-pipeline@mirjam.timer
#     [Timer]
#     OnCalendar=
#     OnCalendar=*-*-* 04:45:00
#
# For the container version of all this, which needs no per-person systemd
# units at all, see docker-compose.yml.
# ---------------------------------------------------------------------------
