# One VM, one UI, one container per pipeline. One Immich instance with a user
# per person -- or several instances, if that is what you have.
#
#   cp .env.example .env               # shared settings only, nobody's name
#   cp config.docker.yaml config.yaml
#
#   # Create the host directories YOURSELF, owned by PIS_UID. A bind mount
#   # whose source does not exist is created by the daemon as root, and these
#   # containers do not run as root.
#   sudo install -d -o "$(id -u)" -g "$(id -g)" /mnt/immich/pis/{state,staging,secrets}
#   printf '%s' 'THE-KEY' > /mnt/immich/pis/secrets/default.key   # one per person
#
#   docker compose build
#   docker compose run --rm ui web-password        # paste into .env
#   docker compose run --rm -p 8399:8399 default login   # once per pipeline
#   docker compose up -d
#   docker compose logs -f
#
# ── ADDING A PERSON ────────────────────────────────────────────────────────
# Three things, none of which is a variable you have to invent:
#
#   1. config.yaml      - name: alice
#   2. this file        alice:
#                         <<: *pipeline
#                         environment:
#                           <<: *pipeline-env
#                           PIS_ACCOUNT: alice
#   3. secrets/alice.key
#
# Her database, staging subtree, Proton session, lock, status file and MQTT
# topic all follow from the name, because config.yaml writes them once with
# `{account}`. There are no ALICE_* entries anywhere, and the three things
# that must differ per account cannot be copy-pasted wrong. It reads the same
# for the fifth person as for the second.
#
# The first pipeline is called "default" because that is what an existing
# single-account install already has in its database -- keeping the name means
# no migration and no renamed Home Assistant entities. A fresh install can
# call it anything.

x-pipeline: &pipeline
  build:
    context: .
    args:
      # Must own the bind-mounted state, staging and secrets directories.
      #   id -u
      UID: ${PIS_UID:-1000}
      GID: ${PIS_GID:-1000}
  image: proton-to-immich-pipeline:latest
  restart: unless-stopped
  # A pipeline is not a service anyone connects to: it reaches out to Proton
  # and to Immich, and nothing reaches in.
  security_opt: [no-new-privileges:true]
  environment: &pipeline-env
    PIS_CONFIG: /config/config.yaml
    # One Immich instance, shared. Someone on a different one overrides
    # IMMICH_INSTANCE_URL in their own service block.
    IMMICH_INSTANCE_URL: ${IMMICH_URL:-http://immich-server:2283/api}
    # Local time decides when agent.at fires.
    TZ: ${TZ:-Europe/Amsterdam}
  volumes:
    - ./config.yaml:/config/config.yaml:ro
    - ${PIS_STATE_DIR:-./state}:/state
    # The whole staging tree and the whole secrets directory, mounted once so
    # a service block needs no paths of its own. Each pipeline only ever
    # touches /staging/<its account> and reads /secrets/<its account>.key,
    # because that is what `{account}` resolves to for it in config.yaml.
    #
    # The trade: a pipeline container *could* read another's key -- they all
    # run as the same uid on the same host anyway. Mounting one path per
    # service is stricter and costs two lines per person:
    #
    #   volumes:
    #     - ./config.yaml:/config/config.yaml:ro
    #     - ${PIS_STATE_DIR:-./state}:/state
    #     - ./staging/alice:/staging/alice
    #     - ./secrets/alice.key:/secrets/alice.key:ro
    - ${PIS_STAGING_DIR:-./staging}:/staging
    - ${PIS_SECRETS_DIR:-./secrets}:/secrets:ro
  networks: [default, immich]

services:
  # ─────────────────────────────────────────────────────────────────────────
  # The UI. Reads every pipeline's database and combines them; writes only
  # `jobs` rows, which each pipeline's own agent picks up. It never executes
  # a sync, so it needs no docker socket and no sudo.
  #
  # It overrides `volumes` and `networks` rather than inheriting them: the UI
  # holds no Proton session, no staging tree and no Immich key, and mounting
  # /secrets into it would quietly undo that.
  # ─────────────────────────────────────────────────────────────────────────
  ui:
    <<: *pipeline
    command: ["serve"]
    environment:
      <<: *pipeline-env
      # `docker compose run --rm ui web-password` prints this line for .env.
      #
      # Deliberately NOT `${...:?}`. A required variable makes *every* compose
      # command fail while it is unset -- build, run, ps, logs -- including
      # the `run ... web-password` you need in order to set it. `serve`
      # enforces this itself and better: it refuses a non-loopback bind with
      # no password (exit 4, `web.refusing_unauthenticated_bind`) and allows a
      # loopback one, which compose cannot tell apart.
      PIS_WEB_PASSWORD_HASH: ${PIS_WEB_PASSWORD_HASH:-}
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ${PIS_STATE_DIR:-./state}:/state
    networks: [default]
    ports:
      # Bind to the LAN only once a password is set, which the line above
      # enforces. Put a reverse proxy in front of it for TLS.
      - "${PIS_WEB_PORT:-8080}:8080"

  # ─────────────────────────────────────────────────────────────────────────
  # The pipelines. One block per person, identical but for the account name.
  # Each owns its own database, staging subtree, Proton session and Immich
  # API key -- the key is what decides whose library an upload lands in.
  # ─────────────────────────────────────────────────────────────────────────
  default:
    <<: *pipeline
    environment:
      <<: *pipeline-env
      PIS_ACCOUNT: default

  mirjam:
    <<: *pipeline
    environment:
      <<: *pipeline-env
      PIS_ACCOUNT: mirjam

  # A third, and a fifth, look exactly like those:
  #
  # alice:
  #   <<: *pipeline
  #   environment:
  #     <<: *pipeline-env
  #     PIS_ACCOUNT: alice
  #
  # Someone on a different Immich adds one line:
  #
  # bob:
  #   <<: *pipeline
  #   environment:
  #     <<: *pipeline-env
  #     PIS_ACCOUNT: bob
  #     IMMICH_INSTANCE_URL: http://other-immich:2283/api

networks:
  default:
  # Immich runs in its own compose project, so join its network by name.
  # `external: true` means compose will not create it -- if the name is wrong
  # you find out at `up`, not at 03:15.
  #
  # Find it with:  docker network ls
  # If Immich is reachable on the host instead, drop this and the `networks:`
  # line in the anchor above, and point IMMICH_URL at the host address.
  immich:
    external: true
    name: ${IMMICH_NETWORK:-immich_default}
