# proton-to-immich-pipeline -- the container layout.
#
# Copy to config.yaml next to docker-compose.yml. It is mounted read-only into
# every container; each pipeline container picks its account with PIS_ACCOUNT,
# and the UI reads all of them.
#
# Paths here are container paths. The host side is in docker-compose.yml.
#
# NEEDS PyYAML for the accounts list -- the image already has it.

# `{account}` is replaced with each pipeline's own name when its settings are
# resolved. Writing the per-account paths once, here, is what keeps a fifth
# person to a single line further down -- and makes it impossible for two of
# them to share a staging directory or a key by copy-paste.
state:
  # The shared volume. One <account>.sqlite per pipeline lives here, and this
  # is the only directory the UI container needs. NOT templated: the UI reads
  # them all from one place.
  dir: /state

staging:
  root: /staging/{account}
  min_free_gb: 20

proton:
  backend: proton-cli
  # Keeps the session in each account's own cache dir rather than a keyring,
  # which a container does not have.
  credentials_store: unsafe_file
  cli_log_level: WARNING
  # One call per batch instead of one per file: ~8 hours of process startup
  # saved on a 25k-file backfill. Set to 1 if a backfill night misbehaves.
  download_batch_size: 25

immich:
  # Resolved per account: /secrets/default.key, /secrets/mirjam.key, ...
  # One key per person, issued by that person's own Immich user -- the key is
  # what decides whose library an upload lands in.
  api_key_file: /secrets/{account}.key
  # upload_mode: api, not cli. The "cli" mode shells out to `docker run
  # immich-cli`, which inside a container needs the docker socket -- a
  # root-equivalent mount for an upload. The REST path needs nothing.
  #
  # Note this is the less-travelled route: see docs/known-issues.md item 3.
  upload_mode: api
  album_strategy: flat
  # immich.url comes from IMMICH_INSTANCE_URL in docker-compose.yml -- one
  # instance shared by everyone, overridable per service for someone on a
  # different one.

limits:
  max_files: 500
  max_bytes: 20000000000
  consecutive_failures: 25

reap:
  keep_days: 7

reconcile:
  enabled: true

delete:
  action: mark_only
  batch_cap: 50

# The loop each pipeline container runs: the schedule *and* the job queue.
# No cron container, no host timer.
agent:
  at: "03:15"          # local time; set TZ in .env
  jitter_sec: 1800
  poll_sec: 5

web:
  # Inside the container. The port mapping decides who can reach it.
  bind: 0.0.0.0
  port: 8080
  # The UI only writes job rows; each pipeline's agent runs them. This is the
  # only runner that works across a container boundary.
  job_runner: queue
  # From PIS_WEB_PASSWORD_HASH in .env.
  password_hash: ""

# WHY THE FIRST ACCOUNT IS CALLED "default"
#
# An existing single-account install already has every row in its database
# stamped `default`, and `default` is special-cased throughout: it keeps
# sync.lock, status.json and the original MQTT node and topic, so Home
# Assistant entities do not move. Keeping the name is the zero-migration path.
#
# A fresh install can call it anything. Renaming an existing one is a real
# migration -- see docs/operations.md, "Going from one account to two".
accounts:
  # One line per person. Everything above that mentions `{account}` is
  # resolved with this name, so nothing here has to repeat a path:
  #
  #   database   /state/<name>.sqlite
  #   staging    /staging/<name>        (and .proton inside it)
  #   key file   /secrets/<name>.key
  #   lock       sync-<name>.lock       (plain sync.lock for "default")
  #   status     status-<name>.json     (plain status.json for "default")
  #   MQTT       proton_immich_sync/<name>/state
  #
  # A fifth person is a fifth entry. Add anything that genuinely differs --
  # a different Immich, different roots, a different delete_action -- under
  # their own name; leave it out and they inherit the shared settings.
  - name: default
    proton_roots:
      - /my-files/Photos
    delete_action: execute

  - name: mirjam
    proton_roots:
      - /my-files/Camera
    delete_action: mark_only

  # - name: alice
  #   proton_roots: ["/my-files/Photos"]
  #
  # - name: bob
  #   immich_url: http://other-immich:2283/api    # a different instance
